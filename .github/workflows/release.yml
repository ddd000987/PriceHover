name: Release

on:
  push:
    tags: ['v*.*.*']

# Nothing is published to a store from here, so this
# workflow holds no store credentials and only needs to write the release.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit SHA: a moving tag would let an upstream
      # compromise run arbitrary code in a job that can write releases.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The notes are written by hand, English then Traditional Chinese, one
      # file per version. A commit list would also pick up the original
      # project's commits, since this fork inherits its tags. Checked first so
      # a release without notes fails before anything is built.
      - name: Check the release notes exist
        run: |
          NOTES=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -s "$NOTES" ]; then
            echo "Missing $NOTES: write the release notes before tagging" >&2
            exit 1
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check the tag matches package.json
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi

      # public/_locales is generated from one table and committed. A key added
      # to the table without regenerating ships a manifest referencing a message
      # that does not exist, which blanks a label rather than failing loudly.
      - name: Check generated locales are up to date
        run: |
          bun run locales
          git diff --exit-code public/_locales

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build Chrome (MV3)
        run: bun run build

      - name: Zip Chrome
        run: bun run zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: .github/release-notes/${{ github.ref_name }}.md
          files: |
            .output/*-chrome.zip
